<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">CheckMyWeb</title>
  <desc id="desc">Website security self-check. A blue shield with a check mark and a list of passed checks.</desc>
  <rect width="1200" height="340" rx="20" fill="#0b1324"/>
  <g transform="translate(62 84) scale(2.5)">
    <path d="M32 4 8 13v17c0 15.5 10.2 26.8 24 30 13.8-3.2 24-14.5 24-30V13Z" fill="#1c64c8"/>
    <path d="M32 10.5 14 17.3v12.9c0 12 7.6 20.9 18 23.8 10.4-2.9 18-11.8 18-23.8V17.3Z" fill="#3b8ff0"/>
    <path d="m22.5 32.5 6.8 6.8 13.2-14.6" fill="none" stroke="#fff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="248" y="176" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="79" font-weight="650" letter-spacing="-3">CheckMyWeb</text>
  <text x="251" y="213" fill="#4dabf7" font-family="Segoe UI,Arial,sans-serif" font-size="19">Website security self-check</text>
  <text x="66" y="290" fill="#c8cfdb" font-family="Segoe UI,Arial,sans-serif" font-size="23">See your site the way the internet does.</text>
  <rect x="836" y="70" width="294" height="200" rx="14" fill="#111c33" stroke="#24345a" stroke-width="2"/>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#c8cfdb">
    <circle cx="868" cy="110" r="9" fill="#51cf66"/><text x="890" y="116">HTTPS · TLS 1.3</text>
    <circle cx="868" cy="150" r="9" fill="#51cf66"/><text x="890" y="156">HSTS · cookies</text>
    <circle cx="868" cy="190" r="9" fill="#fcc419"/><text x="890" y="196">Content-Security-Policy</text>
    <circle cx="868" cy="230" r="9" fill="#51cf66"/><text x="890" y="236">SPF · DMARC · DKIM</text>
  </g>
</svg>
